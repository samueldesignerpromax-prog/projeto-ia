services:
  - type: web
    name: jarvis
    env: python
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: jarvis-db
          property: connectionString
      - key: ENVIRONMENT
        value: production

databases:
  - name: jarvis-db
    databaseName: jarvis_db
    user: jarvis_user
