<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis - Assistente de IA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 800px;
            height: 600px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 25px;
        }
        .header-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .avatar {
            font-size: 40px;
            background: rgba(255,255,255,0.2);
            padding: 10px;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-info h1 { font-size: 24px; font-weight: 600; }
        .status { font-size: 14px; opacity: 0.9; }
        .chat-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: slideIn 0.3s ease;
        }
        .message.user { align-self: flex-end; }
        .message.bot { align-self: flex-start; }
        .message-content {
            padding: 12px 18px;
            border-radius: 18px;
            word-wrap: break-word;
            line-height: 1.5;
        }
        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.bot .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }
        .message-time {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
            padding: 0 5px;
        }
        .message.user .message-time { text-align: right; }
        .typing-indicator {
            display: none;
            align-self: flex-start;
            background: white;
            padding: 12px 18px;
            border-radius: 18px;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }
        .typing-indicator.active { display: block; }
        .typing-dots {
            display: flex;
            gap: 4px;
        }
        .typing-dots span {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: typing 1.4s infinite both;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        footer {
            background: white;
            padding: 15px 20px;
            border-top: 1px solid #e0e0e0;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        #messageInput {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        #messageInput:focus { border-color: #667eea; }
        #sendButton {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        #sendButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102,126,234,0.4);
        }
        #sendButton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .footer-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            font-size: 13px;
            color: #666;
        }
        .user-id-input {
            padding: 5px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            max-width: 150px;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 600px) {
            .container { height: 100vh; border-radius: 0; }
            .message { max-width: 90%; }
            .header-info h1 { font-size: 20px; }
            .avatar { width: 45px; height: 45px; font-size: 30px; }
            .user-id-input { max-width: 100px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <div class="avatar">🤖</div>
                <div class="header-info">
                    <h1>Jarvis</h1>
                    <span class="status">🟢 Online</span>
                </div>
            </div>
        </header>
        <main class="chat-area" id="chatArea">
            <div class="message bot">
                <div class="message-content">Olá! Sou o Jarvis, seu assistente de IA. Como posso ajudá-lo hoje?</div>
                <div class="message-time">Agora</div>
            </div>
        </main>
        <footer>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Digite sua mensagem..." autofocus>
                <button id="sendButton">Enviar</button>
            </div>
            <div class="footer-info">
                <span>ID do Usuário:</span>
                <input type="text" id="userIdInput" value="usuario_123" class="user-id-input">
            </div>
        </footer>
    </div>
    <script>
        // A URL do backend é a mesma do frontend (relativa)
        const API_URL = window.location.origin;
        
        const chatArea = document.getElementById('chatArea');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const userIdInput = document.getElementById('userIdInput');
        
        let isProcessing = false;
        
        function addMessage(text, sender, timestamp = null) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = text;
            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            timeDiv.textContent = timestamp || new Date().toLocaleTimeString();
            messageDiv.appendChild(contentDiv);
            messageDiv.appendChild(timeDiv);
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator active';
            typingDiv.id = 'typingIndicator';
            const dotsDiv = document.createElement('div');
            dotsDiv.className = 'typing-dots';
            for (let i = 0; i < 3; i++) {
                const dot = document.createElement('span');
                dotsDiv.appendChild(dot);
            }
            typingDiv.appendChild(dotsDiv);
            chatArea.appendChild(typingDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        function hideTyping() {
            const typingDiv = document.getElementById('typingIndicator');
            if (typingDiv) typingDiv.remove();
        }
        
        async function sendMessage() {
            const message = messageInput.value.trim();
            const userId = userIdInput.value.trim() || 'usuario_123';
            if (!message || isProcessing) return;
            messageInput.value = '';
            isProcessing = true;
            sendButton.disabled = true;
            addMessage(message, 'user');
            showTyping();
            try {
                const response = await fetch(`${API_URL}/api/v1/chat/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, message: message })
                });
                hideTyping();
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();
                addMessage(data.assistant_response, 'bot', new Date(data.timestamp).toLocaleTimeString());
            } catch (error) {
                hideTyping();
                console.error('Erro:', error);
                addMessage('❌ Erro ao conectar com o servidor. Verifique se o backend está no ar.', 'bot');
            }
            isProcessing = false;
            sendButton.disabled = false;
            messageInput.focus();
        }
        
        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
        
        document.addEventListener('DOMContentLoaded', () => {
            messageInput.focus();
        });
    </script>
</body>
</html>
